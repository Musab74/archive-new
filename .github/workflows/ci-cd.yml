name: CI/CD (develop)

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-timeless
  cancel-in-progress: false

env:
  NODE_VERSION: '20'

jobs:
  ci:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test
      - name: Build (production API base)
        run: npm run build
        env:
          VITE_API_BASE: https://api.timeless.uz
          VITE_PUBLIC_WEB_URL: https://timeless.uz
      - name: Pack dist
        run: tar -czf web-dist.tar.gz -C apps/web/dist .
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist-${{ github.sha }}
          path: web-dist.tar.gz
          retention-days: 14

  deploy:
    name: Deploy to timeless.uz
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://timeless.uz
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-dist-${{ github.sha }}
      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # AINEX_ARCHIVE = the ghdeploy private key (repository secret); the host key below is public
          printf '%s\n' "${{ secrets.AINEX_ARCHIVE }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo '[timeless.uz]:2222 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIa78uHk45XtN4nCosu1HdOrdj8Inj6U6a1ak7wD7oqL' > ~/.ssh/known_hosts
      - name: Validate the deploy key secret
        run: |
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > ~/.ssh/deploy_key.pub 2> ~/.ssh/keyerr; then
            echo "::error::AINEX_ARCHIVE is not a valid OpenSSH private key ($(cat ~/.ssh/keyerr)). Paste the whole file from 'sudo cat /root/ghdeploy-github-key' (BEGIN..END lines, Unix line breaks)."; exit 1
          fi
          echo "deploy key fingerprint: $(ssh-keygen -lf ~/.ssh/deploy_key.pub)"
      - name: Check the server is reachable on port 2222 (IPv4, 3 tries, warning only)
        run: |
          for i in 1 2 3; do
            if nc -4 -z -w 10 timeless.uz 2222; then echo "port 2222 reachable (try $i)"; exit 0; fi
            echo "try $i: no connection yet"; sleep 10
          done
          echo "::warning::could not pre-check timeless.uz:2222 from this runner; trying the release anyway"
      - name: "Release on the server (forced command: unpack, validate, atomic switch, public check, prune)"
        run: |
          ok=0
          for attempt in 1 2 3; do
            ssh -4 -v -p 2222 -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=25 -o ServerAliveInterval=15 \
              ghdeploy@timeless.uz "release sha=${GITHUB_SHA} ref=${GITHUB_REF_NAME}" < web-dist.tar.gz > out.log 2> ssh.log
            rc=$?
            echo "attempt $attempt: ssh exit $rc"; cat out.log
            if grep -q "release ok" out.log; then ok=1; break; fi
            grep -E "Connecting to|Connection established|Authenticated|Permission denied|Connection timed out|Connection refused|Connection closed|exit-status|Transferred" ssh.log | tail -12
            sleep 20
          done
          [ "$ok" = 1 ] || { echo "::error::release did not complete — last ssh log:"; tail -30 ssh.log; exit 1; }
      - name: Verify
        run: |
          curl -fsS -m 20 https://timeless.uz/ | grep -q 'id="root"'
          echo "https://timeless.uz is serving ${GITHUB_SHA}"

