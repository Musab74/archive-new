name: CI/CD (develop)

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-timeless
  cancel-in-progress: false

env:
  NODE_VERSION: '20'

jobs:
  ci:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test
      - name: Build (production API base)
        run: npm run build
        env:
          VITE_API_BASE: https://api.timeless.uz
          VITE_PUBLIC_WEB_URL: https://timeless.uz
      - name: Pack dist
        run: tar -czf web-dist.tar.gz -C apps/web/dist .
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist-${{ github.sha }}
          path: web-dist.tar.gz
          retention-days: 14

  # The server cannot be reached from GitHub's network on SSH (provider-side filtering), so deploys are PULL based:
  # this job publishes the built site to the `deploy/develop` branch; on the server a systemd timer
  # (ops/github-deploy/ainex-pull-deploy) fetches that branch every minute and releases it locally.
  publish:
    name: Publish build to deploy/develop
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: production
      url: https://timeless.uz
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-dist-${{ github.sha }}
      - name: Unpack
        run: mkdir site && tar -xzf web-dist.tar.gz -C site
      - name: Stamp
        run: |
          printf 'source=%s\nref=%s\nrun=%s\nbuilt=%s\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" "$GITHUB_RUN_ID" "$(date -u +%FT%TZ)" > site/BUILD_SOURCE
          cat site/BUILD_SOURCE
      - name: Push to deploy/develop (orphan branch, one commit per build)
        run: |
          cd site
          git init -q -b deploy/develop
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "build ${GITHUB_SHA} from develop (run ${GITHUB_RUN_ID})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/deploy/develop
      - name: Wait for the server to pick it up (timer runs every minute)
        run: |
          for i in $(seq 1 12); do
            sleep 20
            if curl -fsS -m 15 "https://timeless.uz/BUILD_SOURCE?nocache=$i" 2>/dev/null | grep -q "source=${GITHUB_SHA}"; then
              echo "https://timeless.uz is serving ${GITHUB_SHA}"; exit 0
            fi
          done
          echo "::warning::the server has not released ${GITHUB_SHA} yet (timer may be delayed); check /var/log/ainex/deploy.log on the server"
